{% extends 'base.html' %}
{% load GPTrivia_extras %}
{% load static %}

{% block extra_meta %}
    <meta name="theme-color" content="#f94144">
{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'GPTrivia/css/player_analysis.css' %}?v=20260320m">
{% endblock %}

{% block content %}
<div class="content-wrapper">
    <div class="select-wrapper">
        <div class="select-container">
            <label for="creator-selector" class="select-label">Creator</label>
            <select name="creators" id="creator-selector" class="select-dropdown">
                <option value="" {% if not initial_creator_selection %}selected{% endif %}>-- Select a creator --</option>
                {% for creator in creators %}
                <option value="{{ creator }}" {% if creator == initial_creator_selection %}selected{% endif %}>{{ creator }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="select-container">
            <label for="category-selector" class="select-label">Category</label>
            <select name="categories" id="category-selector" class="select-dropdown">
                <option value="" {% if not initial_category_selection %}selected{% endif %}>-- Select a category --</option>
                {% for category in categories %}
                <option value="{{ category }}" {% if category == initial_category_selection %}selected{% endif %}>{{ category }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="select-container">
            <label for="player-selector" class="select-label">Player</label>
            <select name="players" id="player-selector" class="select-dropdown">
                <option value="" {% if not initial_player_selection %}selected{% endif %}>-- Select a player --</option>
                {% for player in players %}
                <option value="{{ player }}" {% if player == initial_player_selection %}selected{% endif %}>{{ player }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="select-container select-container--checkbox">
            <label for="include-coop-checkbox" class="select-label">Include in Analysis</label>
            <label class="analysis-checkbox-toggle" for="include-coop-checkbox">
                <input type="checkbox" id="include-coop-checkbox" {% if initial_include_coop %}checked{% endif %}>
                <span>Include co-op rounds</span>
            </label>
            <label class="analysis-checkbox-toggle" for="include-inactive-checkbox">
                <input type="checkbox" id="include-inactive-checkbox" {% if initial_include_inactive %}checked{% endif %}>
                <span>Include inactive players/creators</span>
            </label>
        </div>
    </div>

    <!-- Plots and Graphs -->
    <div class="plots-container">
        <section class="analysis-plot-card" data-plot-card="bar-space">
            <div id="bar-space" class="plot-div plot-div--standard"></div>
        </section>
        <section class="analysis-plot-card" data-plot-card="violin-space">
            <div id="violin-space" class="plot-div plot-div--standard"></div>
        </section>
        <section class="analysis-plot-card" data-plot-card="CorrMatrix">
            <div id="CorrMatrix" class="plot-div plot-div--matrix"></div>
        </section>
        <section class="analysis-plot-card" data-plot-card="CreatorMatrix">
            <div id="CreatorMatrix" class="plot-div plot-div--matrix plot-div--creator-matrix">
                <div id="plot-checkbox" class="analysis-plot-checkbox">
                    <label for="showValuesCheckbox">Difficulty Adjustment</label>
                    <input type="checkbox" id="showValuesCheckbox">
                </div>
            </div>
        </section>
        <section class="analysis-plot-card" data-plot-card="PCAplot">
            <div id="PCAplot" class="plot-div plot-div--tall"></div>
        </section>
        <section class="analysis-plot-card" data-plot-card="catBar">
            <div id="catBar" class="plot-div plot-div--standard"></div>
        </section>
        <section class="analysis-plot-card" data-plot-card="creatorBar">
            <div id="creatorBar" class="plot-div plot-div--standard"></div>
        </section>
        <section class="analysis-plot-card" data-plot-card="player-bar-space">
            <div id="player-bar-space" class="plot-div plot-div--standard"></div>
        </section>
        <section class="analysis-plot-card" data-plot-card="player-violin-space">
            <div id="player-violin-space" class="plot-div plot-div--standard"></div>
        </section>
        <section class="analysis-plot-card" data-plot-card="player-cat-bar-space">
            <div id="player-cat-bar-space" class="plot-div plot-div--standard"></div>
        </section>
        <section class="analysis-plot-card" data-plot-card="creator-violin-space">
            <div id="creator-violin-space" class="plot-div plot-div--standard"></div>
        </section>
        <section class="analysis-plot-card" data-plot-card="time-series-creator">
            <div id="time-series-creator" class="plot-div plot-div--standard"></div>
        </section>
        <section class="analysis-plot-card" data-plot-card="trivia-night-streak">
            <div id="trivia-night-streak" class="plot-div plot-div--standard"></div>
        </section>
        <section class="analysis-plot-card" data-plot-card="joker_percentage">
            <div id="joker_percentage" class="plot-div plot-div--auto"></div>
        </section>
        <section class="analysis-plot-card" data-plot-card="joker-creator-summary">
            <div id="joker-creator-summary" class="plot-div plot-div--standard"></div>
        </section>
        <section class="analysis-plot-card" data-plot-card="joker-category-summary">
            <div id="joker-category-summary" class="plot-div plot-div--standard"></div>
        </section>
    </div>

    <button class="expand-collapse-button" id="roundsButton" onclick="toggleRounds()">Show/Hide Rounds Table</button>
    <div id="column-checkboxes" style="width:100%; display: none;">
    <!-- Checkboxes will be dynamically generated here -->
    </div>

    <div id="rounds-table"></div>
</div>
{% endblock %}


{% block extra_js %}
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script>

    let playerColorMapping = {{ player_color_mapping_json|safe }};
    let playerTextMapping = {{ player_text_mapping_json|safe }};
    const profileUrlTemplate = "{% url 'player_profile' '__PROFILE_NAME__' %}";
    const isLightTheme = document.body.dataset.profileTheme === 'light';
    const analysisTextColor = isLightTheme ? '#1b2530' : '#ffffff';
    const analysisGridColor = isLightTheme ? 'rgba(27, 37, 48, 0.16)' : 'rgba(255, 255, 255, 0.2)';
    const shellChromeColor = getComputedStyle(document.documentElement).getPropertyValue('--shell-chrome-color').trim() || '#f94144';
    const analysisLoadingSpinnerUrl = "{% static 'GPTrivia/css/ouroboros.png' %}";

    function escapeHtml(value) {
        return String(value ?? '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function escapeAttribute(value) {
        return escapeHtml(value);
    }

    function profileUrlForName(name) {
        return profileUrlTemplate.replace('__PROFILE_NAME__', encodeURIComponent(name || ''));
    }

    function getAnalysisMisc() {
        const includeCoopCheckbox = document.getElementById('include-coop-checkbox');
        const includeInactiveCheckbox = document.getElementById('include-inactive-checkbox');
        const miscFlags = [];
        if (includeCoopCheckbox && includeCoopCheckbox.checked) {
            miscFlags.push('include_coop');
        }
        if (includeInactiveCheckbox && includeInactiveCheckbox.checked) {
            miscFlags.push('include_inactive');
        }
        return miscFlags.join(',');
    }

    function getSelectedAnalysisFilters() {
        const creatorSelector = document.getElementById('creator-selector');
        const categorySelector = document.getElementById('category-selector');
        const playerSelector = document.getElementById('player-selector');
        const includeCoopCheckbox = document.getElementById('include-coop-checkbox');
        const includeInactiveCheckbox = document.getElementById('include-inactive-checkbox');

        return {
            creator: creatorSelector ? creatorSelector.value : '',
            category: categorySelector ? categorySelector.value : '',
            player: playerSelector ? playerSelector.value : '',
            includeCoop: Boolean(includeCoopCheckbox && includeCoopCheckbox.checked),
            includeInactive: Boolean(includeInactiveCheckbox && includeInactiveCheckbox.checked),
        };
    }

    function extractTitleText(title) {
        if (!title) {
            return '';
        }
        if (typeof title === 'string') {
            return title;
        }
        return title.text || '';
    }

    function extractAxisTitleText(axis = {}) {
        if (!axis || !axis.title) {
            return '';
        }
        if (typeof axis.title === 'string') {
            return axis.title;
        }
        return axis.title.text || '';
    }

    function possessiveSuffix(name) {
        return /s$/i.test((name || '').trim()) ? "'" : "'s";
    }

    function linkedProfileName(name) {
        if (!name) {
            return '';
        }
        return `<a href="${escapeAttribute(profileUrlForName(name))}" class="analysis-profile-link" data-player-name="${escapeAttribute(name)}">${escapeHtml(name)}</a>`;
    }

    function linkedPossessiveName(name) {
        return `${linkedProfileName(name)}${possessiveSuffix(name)}`;
    }

    function analysisRoundScopeHtml({ creator, category }) {
        if (creator && category) {
            return `on ${linkedPossessiveName(creator)} ${escapeHtml(category)} Rounds`;
        }
        if (creator) {
            return `on ${linkedPossessiveName(creator)} Rounds`;
        }
        if (category) {
            return `on ${escapeHtml(category)} Rounds`;
        }
        return 'on All Rounds';
    }

    function ensurePlotDescriptionElement(targetId) {
        const plotElement = document.getElementById(targetId);
        if (!plotElement) {
            return null;
        }

        const descriptionId = `${targetId}-description`;
        let descriptionElement = document.getElementById(descriptionId);
        if (!descriptionElement) {
            descriptionElement = document.createElement('div');
            descriptionElement.id = descriptionId;
            descriptionElement.className = 'analysis-plot-description';
            plotElement.parentNode.insertBefore(descriptionElement, plotElement);
        }

        return descriptionElement;
    }

    function setPlotDescription(targetId, html) {
        const descriptionElement = ensurePlotDescriptionElement(targetId);
        if (!descriptionElement) {
            return;
        }

        if (!html) {
            descriptionElement.innerHTML = '';
            descriptionElement.style.display = 'none';
            return;
        }

        descriptionElement.innerHTML = html;
        descriptionElement.style.display = 'block';
        enhanceAnalysisProfileLinks(descriptionElement);
    }

    function clearPlotDescription(targetId) {
        setPlotDescription(targetId, '');
    }

    function ensurePlotLoadingElement(targetId) {
        const plotElement = document.getElementById(targetId);
        if (!plotElement || !plotElement.parentNode) {
            return null;
        }

        const loadingId = `${targetId}-loading`;
        let loadingElement = document.getElementById(loadingId);
        if (!loadingElement) {
            loadingElement = document.createElement('div');
            loadingElement.id = loadingId;
            loadingElement.className = 'analysis-plot-loading';
            loadingElement.innerHTML = `
                <span class="analysis-plot-loading-text">Loading plot...</span>
                <img src="${analysisLoadingSpinnerUrl}" class="analysis-plot-loading-spinner" alt="Loading...">
            `;
            plotElement.parentNode.insertBefore(loadingElement, plotElement);
        }

        return loadingElement;
    }

    function showPlotLoadingState(targetId, message = 'Loading plot...') {
        const plotElement = document.getElementById(targetId);
        const loadingElement = ensurePlotLoadingElement(targetId);

        if (loadingElement) {
            const textElement = loadingElement.querySelector('.analysis-plot-loading-text');
            if (textElement) {
                textElement.textContent = message;
            }
            loadingElement.style.display = 'flex';
        }

        if (plotElement) {
            plotElement.style.display = 'none';
        }
    }

    function hidePlotLoadingState(targetId) {
        const plotElement = document.getElementById(targetId);
        const loadingElement = document.getElementById(`${targetId}-loading`);

        if (loadingElement) {
            loadingElement.style.display = 'none';
        }

        if (plotElement) {
            plotElement.style.display = 'block';
        }
    }

    function clearAllPlotDescriptions() {
        [
            'bar-space',
            'violin-space',
            'CorrMatrix',
            'CreatorMatrix',
            'PCAplot',
            'catBar',
            'creatorBar',
            'player-violin-space',
            'creator-violin-space',
            'time-series-creator',
            'trivia-night-streak',
            'joker_percentage',
            'joker-creator-summary',
            'joker-category-summary',
        ].forEach(clearPlotDescription);
    }

    function buildPlotDescription(targetId, data = {}) {
        const { creator, category, player } = getSelectedAnalysisFilters();
        const scope = analysisRoundScopeHtml({ creator, category });
        const playerName = player ? linkedProfileName(player) : '';
        const playerPossessive = player ? linkedPossessiveName(player) : '';
        const groupLabel = extractAxisTitleText({ title: data.xaxis || '' }).toLowerCase();

        switch (targetId) {
            case 'bar-space':
                return `This chart shows how much each player's average score ${scope} rises or falls relative to that player's own average across all available rounds.`;
            case 'violin-space':
                return `This chart shows how far above or below each player's typical normalized score they land ${scope}, after scaling every round to a 10-point system.`;
            case 'CorrMatrix':
                return `This matrix shows how predictive one player's score ${scope} is of other players' scores on the same rounds; 1 means perfect prediction, 0 means no correlation, and negative values mean players tend to move in opposite directions.`;
            case 'CreatorMatrix':
                return `This chart shows creator favoritism${player ? ` toward ${playerName}` : ''}${creator ? ` on ${linkedPossessiveName(creator)} rounds` : ''}${category ? ` within ${escapeHtml(category)} rounds` : ''}; each table value is the size of that favoritism in points.`;
            case 'PCAplot':
                return `This chart shows which players tend to score similarly ${scope}; players that are closer together in 3D space have more similar scoring patterns.`;
            case 'catBar':
                return `This chart shows the average normalized score by category ${scope}, after scaling every round to a 10-point system.`;
            case 'creatorBar':
                return `This chart shows the average normalized score by creator ${scope}, after scaling every round to a 10-point system.`;
            case 'player-violin-space':
            case 'creator-violin-space':
                return `This chart shows how ${playerName} scores ${scope}, grouped by ${escapeHtml(groupLabel || 'group')}, relative to ${playerPossessive} typical normalized score.`;
            case 'time-series-creator':
                return `This moving average shows whether ${playerName} has recently been scoring higher or lower than ${playerName} typically does ${scope}, relative to the field.`;
            case 'trivia-night-streak':
                return `This chart shows how many consecutive trivia nights were played without skipping a week.`;
            case 'joker_percentage':
                return `This table shows how often each player's joker landed on that player's highest-scoring round of the night.`;
            case 'joker-creator-summary':
                return `This chart shows which creators ${playerName} jokers most often; the stars mark the creators where ${playerName} has the highest average score overall, while the hover text compares jokered rounds to all rounds.`;
            case 'joker-category-summary':
                return `This chart shows which categories ${playerName} jokers most often; the stars mark the categories where ${playerName} has the highest average score overall, while the hover text compares jokered rounds to all rounds.`;
            default:
                return '';
        }
    }

    function buildAnalysisTitle(targetId, layout = {}) {
        const rawTitle = extractTitleText(layout.title);
        const { creator, category, player } = getSelectedAnalysisFilters();
        const scope = analysisRoundScopeHtml({ creator, category });
        const groupLabel = extractAxisTitleText(layout.xaxis);

        switch (targetId) {
            case 'player-bar-space':
            case 'player-cat-bar-space':
                if (!player) {
                    return rawTitle;
                }
                return `${linkedPossessiveName(player)} Mean Score ${scope}${groupLabel ? ` by ${escapeHtml(groupLabel)}` : ''}`;
            case 'player-violin-space':
            case 'creator-violin-space':
                if (!player) {
                    return rawTitle;
                }
                return `${linkedPossessiveName(player)} Score Distribution ${scope}${groupLabel ? ` by ${escapeHtml(groupLabel)}` : ''}`;
            case 'time-series-creator':
                if (!player) {
                    return rawTitle;
                }
                return `${linkedPossessiveName(player)} Performance Trend ${scope}`;
            case 'trivia-night-streak':
                if (!player) {
                    return rawTitle;
                }
                return `${linkedPossessiveName(player)} Trivia Night Streak`;
            case 'joker-creator-summary':
                if (!player) {
                    return rawTitle;
                }
                return `${linkedPossessiveName(player)} Most Jokered Creators`;
            case 'joker-category-summary':
                if (!player) {
                    return rawTitle;
                }
                return `${linkedPossessiveName(player)} Most Jokered Categories`;
            case 'bar-space':
                return rawTitle;
            case 'violin-space':
                return rawTitle;
            case 'PCAplot':
                if (!creator) {
                    return rawTitle;
                }
                return `PCA Similarity ${scope}`;
            case 'CorrMatrix':
                if (!creator) {
                    return rawTitle;
                }
                return `Player Correlation Matrix ${scope}`;
            case 'catBar':
                if (!creator) {
                    return rawTitle;
                }
                return `Mean Normalized Score ${scope}${groupLabel ? ` by ${escapeHtml(groupLabel)}` : ''}`;
            default:
                return rawTitle;
        }
    }

    function withLinkedAnalysisTitle(target, layout = {}) {
        let targetId = '';
        if (typeof target === 'string') {
            targetId = target;
        } else if (target) {
            targetId = target.id || (typeof target.getAttribute === 'function' ? target.getAttribute('id') : '') || '';
        }
        const titleText = buildAnalysisTitle(targetId, layout);

        if (!titleText || titleText === extractTitleText(layout.title)) {
            return layout;
        }

        if (layout.title && typeof layout.title === 'object') {
            return {
                ...layout,
                title: {
                    ...layout.title,
                    text: titleText,
                },
            };
        }

        return {
            ...layout,
            title: {
                text: titleText,
            },
        };
    }

    function decorateAnalysisProfileLink(linkElement) {
        if (!linkElement || linkElement.dataset.analysisProfileLinkBound === 'true') {
            return;
        }

        const playerName = linkElement.dataset.playerName || (linkElement.textContent || '').trim();
        const hoverColor = playerColorMapping[playerName] || analysisTextColor;
        const defaultColor = isLightTheme ? '#000000' : analysisTextColor;

        const applyLinkColor = (color) => {
            const nodes = [linkElement, ...linkElement.querySelectorAll('*')];
            nodes.forEach((node) => {
                if (!(node instanceof Element)) {
                    return;
                }
                node.style.setProperty('color', color, 'important');
                node.style.setProperty('fill', color, 'important');
                node.setAttribute('fill', color);
            });
        };

        linkElement.dataset.analysisProfileLinkBound = 'true';
        linkElement.style.textDecoration = 'none';
        linkElement.style.transition = 'color 0.18s ease, fill 0.18s ease';
        applyLinkColor(defaultColor);

        const setDefaultColor = () => {
            applyLinkColor(defaultColor);
        };
        const setHoverColor = () => {
            applyLinkColor(hoverColor);
        };

        linkElement.addEventListener('mouseenter', setHoverColor);
        linkElement.addEventListener('mouseleave', setDefaultColor);
        linkElement.addEventListener('focus', setHoverColor);
        linkElement.addEventListener('blur', setDefaultColor);
    }

    function enhanceAnalysisProfileLinks(root) {
        if (!root || typeof root.querySelectorAll !== 'function') {
            return;
        }

        root.querySelectorAll('.analysis-profile-link').forEach(decorateAnalysisProfileLink);
    }

    function bindPlotEnhancers(plotElement) {
        if (!plotElement || plotElement.dataset.analysisEnhancersBound === 'true') {
            return;
        }

        plotElement.dataset.analysisEnhancersBound = 'true';
        if (typeof plotElement.on === 'function') {
            plotElement.on('plotly_afterplot', () => {
                enhancePlotAxisLabels(plotElement);
                enhanceAnalysisProfileLinks(plotElement);
            });
        }
    }

    function enhancePlotAxisLabels(target) {
        const plotElement = typeof target === 'string' ? document.getElementById(target) : target;
        if (!plotElement) {
            return;
        }

        plotElement.querySelectorAll('.xtick text, .ytick text').forEach((tickLabel) => {
            const tickText = (tickLabel.textContent || '').trim();
            if (!tickText || !Object.prototype.hasOwnProperty.call(playerColorMapping, tickText)) {
                return;
            }
            if (tickLabel.dataset.profileLinked === 'true') {
                return;
            }

            const hoverColor = playerColorMapping[tickText] || analysisTextColor;
            tickLabel.dataset.profileLinked = 'true';
            tickLabel.style.cursor = 'pointer';
            tickLabel.style.pointerEvents = 'all';

            tickLabel.addEventListener('mouseenter', () => {
                tickLabel.style.fill = hoverColor;
            });
            tickLabel.addEventListener('mouseleave', () => {
                tickLabel.style.fill = analysisTextColor;
            });
            tickLabel.addEventListener('click', () => {
                window.location.href = profileUrlForName(tickText);
            });
        });
    }

    function applyAxisTheme(axis = {}) {
        const themedAxis = { ...axis };

        if (Object.prototype.hasOwnProperty.call(themedAxis, 'gridcolor') || themedAxis.showgrid !== false) {
            themedAxis.gridcolor = analysisGridColor;
        }

        if (themedAxis.title && typeof themedAxis.title === 'object') {
            themedAxis.title = {
                ...themedAxis.title,
                font: {
                    ...(themedAxis.title.font || {}),
                    color: analysisTextColor,
                },
            };
        }

        themedAxis.tickfont = {
            ...(themedAxis.tickfont || {}),
            color: analysisTextColor,
        };

        return themedAxis;
    }

    function applySceneAxisTheme(axis = {}) {
        const themedAxis = { ...axis };

        if (themedAxis.title && typeof themedAxis.title === 'object') {
            themedAxis.title = {
                ...themedAxis.title,
                font: {
                    ...(themedAxis.title.font || {}),
                    color: analysisTextColor,
                },
            };
        }

        themedAxis.color = analysisTextColor;
        themedAxis.gridcolor = analysisGridColor;
        themedAxis.linecolor = analysisTextColor;
        themedAxis.zerolinecolor = analysisGridColor;
        themedAxis.tickfont = {
            ...(themedAxis.tickfont || {}),
            color: analysisTextColor,
        };

        return themedAxis;
    }

    function applyPlotTheme(layout = {}) {
        const themedLayout = {
            ...layout,
            plot_bgcolor: 'rgba(0,0,0,0)',
            paper_bgcolor: 'rgba(0,0,0,0)',
            font: {
                ...(layout.font || {}),
                color: analysisTextColor,
                family: 'YoungSerif',
            },
        };

        if (layout.xaxis) {
            themedLayout.xaxis = applyAxisTheme(layout.xaxis);
        }

        if (layout.yaxis) {
            themedLayout.yaxis = applyAxisTheme(layout.yaxis);
        }

        if (layout.scene) {
            themedLayout.scene = {
                ...layout.scene,
                xaxis: applySceneAxisTheme(layout.scene.xaxis || {}),
                yaxis: applySceneAxisTheme(layout.scene.yaxis || {}),
                zaxis: applySceneAxisTheme(layout.scene.zaxis || {}),
            };
        }

        return themedLayout;
    }

    const originalPlotlyNewPlot = Plotly.newPlot.bind(Plotly);
    Plotly.newPlot = function(target, data, layout, config) {
        const linkedLayout = withLinkedAnalysisTitle(target, layout || {});
        const normalizedConfig = {
            responsive: true,
            displaylogo: false,
            ...(config || {}),
            displayModeBar: false,
        };
        return Promise.resolve(
            originalPlotlyNewPlot(target, data, applyPlotTheme(linkedLayout), normalizedConfig)
        ).then((result) => {
            const plotElement = typeof target === 'string' ? document.getElementById(target) : target;
            bindPlotEnhancers(plotElement || target);
            enhancePlotAxisLabels(plotElement || target);
            enhanceAnalysisProfileLinks(plotElement || target);
            return result;
        });
    };

    const analysisPlotUrl = '{% url "player_analysis_plot" %}';
    const analysisNavigationEntry = performance.getEntriesByType('navigation')[0];
    const analysisForceRefresh = Boolean(analysisNavigationEntry && analysisNavigationEntry.type === 'reload');
    $.ajaxPrefilter(function(options) {
        if (options.url !== analysisPlotUrl) {
            return;
        }

        const miscValue = getAnalysisMisc();
        if (typeof options.data === 'string') {
            const separator = options.data ? '&' : '';
            const refreshQuery = analysisForceRefresh ? `&refresh=1` : '';
            options.data = `${options.data}${separator}misc=${encodeURIComponent(miscValue)}${refreshQuery}`;
            return;
        }

        options.data = {
            ...(options.data || {}),
            misc: miscValue,
            ...(analysisForceRefresh ? { refresh: '1' } : {}),
        };
    });

    // Initialize with default values
    let playerName = "";
    let textColor = "";

    document.getElementById('player-selector').addEventListener('change', function () {
        playerName = this.value;
        textColor = playerTextMapping[playerName];
        setButtonColors();
    });

    let plotFlags = {
        bar: false,
        violin: false,
        corrMatrix: false,
        creatorMatrix: false,
        pca: false,
        catBar: false,
        creatorBar: false,
        playerBar: false,
        playerViolin: false,
        playerCatBar: false,
        creatorViolin: false,
        timeSeriesCreator: false,
        roundsTable: false,
        triviaNightStreak: false,
        jokerPercentage: false,
        jokerCreatorSummary: false,
        jokerCategorySummary: false
    };

    function toggleRounds() {
        const roundsTable = document.getElementById('rounds-table');
        if (roundsTable.style.display === "none") {

    function addHoverEffect(button, color) {
        button.addEventListener('mouseover', function() {

        button.addEventListener('mouseout', function() {

        });
    }

    function darkenColor(hexColor) {
        if (hexColor.startsWith('#')) {
            hexColor = hexColor.slice(1);
        }

        const rgb = hexColor.match(/.{1,2}/g).map((color) => parseInt(color, 16));

        const darkenedRgb = rgb.map((color) => {
            const darkenedValue = Math.round(color * 0.85);
            return Math.max(0, Math.min(255, darkenedValue));
        });

        const darkenedHex = darkenedRgb.map((color) => color.toString(16).padStart(2, '0')).join('');
        return `#${darkenedHex}`;
    }

    function normalizePlotTitleConfig(titleText, compactLayout) {
        const normalizedTitleText = compactLayout ? wrapAnalysisTitleText(titleText) : titleText;
        return {
            text: normalizedTitleText,
            x: 0.5,
            xanchor: 'center',
            y: compactLayout ? 0.95 : 0.965,

    function wrapAnalysisTitleText(titleText, maxLineLength = 28) {
        const words = String(titleText || '').split(/\s+/).filter(Boolean);
        if (!words.length) {
            return '';
        }

        const lines = [];
        let currentLine = words[0];

        for (let index = 1; index < words.length; index += 1) {
            const nextWord = words[index];
            const nextLine = `${currentLine} ${nextWord}`;
            if (nextLine.length <= maxLineLength) {
                currentLine = nextLine;
            } else {
                lines.push(currentLine);
                currentLine = nextWord;
            }
        }

        lines.push(currentLine);
        return lines.join('<br>');
    }

    function buildViolinXPositions(count) {
        const compactLayout = isCompactAnalysisLayout();
        const start = compactLayout ? 1.05 : 1.1;
        const step = compactLayout ? 1.38 : 1.52;
        return Array.from({ length: count }, (_, index) => start + (index * step));
    }

    function buildBoxAlignedViolinMeanShapes(plotData, xPositions) {
        const compactLayout = isCompactAnalysisLayout();
        const lineHalfWidth = compactLayout ? 0.1 : 0.12;
        const lineWidth = compactLayout ? 3 : 4;

        return plotData.map((scores, index) => {
            const numericScores = (scores || []).map(value => Number(value)).filter(value => Number.isFinite(value));
            if (!numericScores.length) {
                return null;
            }

            const meanValue = numericScores.reduce((sum, value) => sum + value, 0) / numericScores.length;

            return {
                type: 'line',
                xref: 'x',
                yref: 'y',
                x0: xPositions[index] - lineHalfWidth,
                x1: xPositions[index] + lineHalfWidth,
                y0: meanValue,
                y1: meanValue,
                line: {
                    color: '#000000',
                    width: lineWidth,
                },
                layer: 'above',
            };
        }).filter(Boolean);
    }

    function buildNumericViolinTraces(labels, plotData, colors, hoverTexts) {
        const compactLayout = isCompactAnalysisLayout();
        const xPositions = buildViolinXPositions(labels.length);
        const traces = labels.map((label, index) => ({
            type: 'violin',
            x: Array((plotData[index] || []).length).fill(xPositions[index]),
            y: plotData[index],
            name: label,
            width: compactLayout ? 0.48 : 0.54,
            box: {
                visible: true

            meanline: {
                visible: false
            },
            points: 'all',
            pointpos: compactLayout ? -1.64 : -1.8,
            jitter: compactLayout ? 0.1 : 0.12,
            marker: {

                size: compactLayout ? 3 : 5,
                opacity: compactLayout ? 0.78 : 0.85,
            },
            text: hoverTexts[index],
            hoverinfo: 'text'
        }));

        traces.xPositions = xPositions;
        return traces;
    }

    function getSquareCellHeatmapLayout(divId, columnCount, rowCount) {
        const compactLayout = isCompactAnalysisLayout();
        const plotElement = document.getElementById(divId);
        const viewportWidth = window.innerWidth || document.documentElement.clientWidth || 0;
        const availableContainerWidth = getPlotContainerWidth(divId, 320, 640);
        const containerWidth = compactLayout
            ? availableContainerWidth
            : Math.min(
                availableContainerWidth,
                Math.max(440, Math.min(viewportWidth * 0.46, 620))
            );
        const margin = {
            l: compactLayout ? 52 : 88,
            r: compactLayout ? 16 : 48,
            t: compactLayout ? 88 : 108,
            b: compactLayout ? 76 : 118,
        };
        const availableInnerWidth = Math.max(180, containerWidth - margin.l - margin.r);
        const cellSize = availableInnerWidth / Math.max(columnCount, 1);
        const innerHeight = cellSize * Math.max(rowCount, 1);
        const width = Math.round(containerWidth);
        const height = Math.round(innerHeight + margin.t + margin.b);

        if (plotElement) {
            plotElement.style.width = `${width}px`;
            plotElement.style.maxWidth = '100%';
            plotElement.style.margin = '0 auto';
            plotElement.style.height = `${height}px`;
            plotElement.style.minHeight = `${height}px`;
        }

        return {
            width,
            height,
            margin,
            compactLayout,
        };
    }

    function generateColumnCheckboxes(data) {
        const columnCheckboxesDiv = document.getElementById('column-checkboxes');
        columnCheckboxesDiv.innerHTML = ''; // Clear previous checkboxes

        data.columns.forEach(column => {
            const label = document.createElement('label');
            label.className = 'inline-checkbox'; // Add inline class

            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            if (column === 'link') {
                checkbox.checked = true; // Initially check the link column
            } else if (column === 'mean_score') {
                checkbox.checked = true; // Initially check the mean score column
            } else if (column === 'date') {
                checkbox.checked = true; // Initially check the creator column
            } else if (column === "title") {
                checkbox.checked = true; // Initially check the creator column
            } else if (column === "player_score") {
                checkbox.checked = true; // Initially check the creator column
            } else if (column === "difficulty_score") {
                checkbox.checked = true; // Initially check the creator column
            } else {
                checkbox.checked = false; // Initially check all columns
            }
            checkbox.value = column;
            checkbox.addEventListener('change', function() {
                renderRoundsTable(data);
            });
            // if the text is MAX SCORE, replace with POSSIBLE SCORE
            if (column === "max_score") {
                column = "possible_score";
            } else if (column === "major_category") {
                column = "category";
            }
            label.appendChild(checkbox);
            label.appendChild(document.createTextNode(column.replace('_', ' ').toUpperCase()));

            columnCheckboxesDiv.appendChild(label);
        });
    }

    function renderRoundsTable(data) {
        const roundsTableDiv = document.getElementById('rounds-table');

        // Clear any existing content in the div
        roundsTableDiv.innerHTML = '';

        // Create the table element
        const table = document.createElement('table');
        table.className = 'table-class'; // Add any class you want for styling

        // Create the table header
        const thead = document.createElement('thead');
        const headerRow = document.createElement('tr');

        const visibleColumns = getVisibleColumns();

        visibleColumns.forEach(column => {
            const th = document.createElement('th');
            th.textContent = column.replace('_', ' ').toUpperCase(); // Adjust the header text as needed
            // if the text is MAX SCORE, replace with POSSIBLE SCORE

    function brightenColor(color, percent) {
        const num = parseInt(color.slice(1), 16);
        const amt = Math.round(2.55 * percent);
        const R = (num >> 16) + amt;
        const G = (num >> 8 & 0x00FF) + amt;
        const B = (num & 0x0000FF) + amt;
        return `#${(
            0x1000000 +
            (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
            (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
            (B < 255 ? B < 1 ? 0 : B : 255)
        ).toString(16).slice(1).toUpperCase()}`;
    }

    function calculateBrightness(color) {
        const num = parseInt(color.slice(1), 16);
        const R = (num >> 16) & 0xFF;
        const G = (num >> 8) & 0xFF;
        const B = num & 0xFF;
        // Calculate luminance
        return 0.299 * R + 0.587 * G + 0.114 * B;
    }

    Object.values(data).forEach(fraction => {
        const fractionCell = fractionRow.insertCell();
        fractionCell.textContent = fraction !== null ? fraction.toFixed(2) : 'N/A';
        fractionCell.style.backgroundColor = getGradientColor(fraction, minFraction, maxFraction);
    });


        document.getElementById('joker_percentage').appendChild(table);
    }

    function renderJokerSelectionSummary(targetId, data) {
        setPlotDescription(targetId, buildPlotDescription(targetId, data));
        if (!data.labels || !data.labels.length) {
            const layout = applyPlotTheme({
                title: data.title,
                xaxis: { visible: false },
                yaxis: { visible: false },
                annotations: [{
                    text: data.empty_message || 'No joker data available.',
                    x: 0.5,
                    y: 0.5,
                    xref: 'paper',
                    yref: 'paper',
                    showarrow: false,
                    font: {
                        color: analysisTextColor,
                        family: 'YoungSerif',
                        size: 18,
                    },
                }],
            });

            Plotly.newPlot(targetId, [], layout, {
                displaylogo: false,
                responsive: true,
            });
            return;
        }

        const jokeredAverages = data.avg_jokered_scores || [];
        const overallAverages = data.avg_overall_scores || [];
        const topLabels = Array.isArray(data.top_labels) ? data.top_labels : [];
        const maxCount = Math.max(...data.counts, 0);
        const medalStyles = {
            1: { symbol: '★', color: '#ffd700', offset: 0.18 },
            2: { symbol: '★', color: '#c0c0c0', offset: 0.44 },
            3: { symbol: '★', color: '#cd7f32', offset: 0.70 },
        };

        const barTrace = {
            x: data.labels,
            y: data.counts,
            type: 'bar',
            marker: {
                color: data.colors,
            },
            customdata: data.labels.map((_, index) => [
                jokeredAverages[index] === null || jokeredAverages[index] === undefined ? 'N/A' : `${(jokeredAverages[index] * 10).toFixed(2)}/10`,
                overallAverages[index] === null || overallAverages[index] === undefined ? 'N/A' : `${(overallAverages[index] * 10).toFixed(2)}/10`,
            ]),
            hovertemplate:
                `%{x}<br>Times jokered: %{y}<br>Average jokered score: %{customdata[0]}<br>Average score on all rounds: %{customdata[1]}<extra></extra>`,
        };

        const traces = [barTrace];
        topLabels.forEach((entry) => {
            const medalStyle = medalStyles[entry.rank];
            if (!medalStyle) {
                return;
            }
            const labelIndex = data.labels.indexOf(entry.label);
            if (labelIndex === -1) {
                return;
            }
            traces.push({
                x: [entry.label],
                y: [data.counts[labelIndex] + Math.max(medalStyle.offset, maxCount * 0.08 + (entry.rank - 1) * 0.26)],
                mode: 'text',
                type: 'scatter',
                text: [medalStyle.symbol],
                textposition: 'middle center',
                textfont: {
                    color: medalStyle.color,
                    size: 24,
                    family: 'YoungSerif',
                },
                hoverinfo: 'skip',
                showlegend: false,
            });
        });

        const compactLayout = isCompactAnalysisLayout();
        const layout = buildResponsiveBarLayout(targetId, data, {
            xaxis: {
                title: { text: data.xaxis },
                tickangle: compactLayout ? -45 : -35,
            },
            yaxis: {
                title: { text: data.yaxis },
                rangemode: 'tozero',
            },
            margin: {
                t: compactLayout ? 64 : 60,
                r: compactLayout ? 10 : 20,
                b: compactLayout ? 108 : 90,
                l: compactLayout ? 54 : 65,
            },
        });

        Plotly.newPlot(targetId, traces, layout, {
            displaylogo: false,
            responsive: true,
        });
    }

    // Helper function to get the gradient color based on the fraction value
    function getGradientColor(value, min, max) {
        if (value === null) return 'lightgray';

        const red = [165, 0, 38];
        const green = [0, 104, 55];

        const interpolateColor = (color1, color2, factor) => {
            if (arguments.length < 3) factor = 0.5;
            const result = color1.slice();
            for (let i = 0; i < 3; i++) {
                result[i] = Math.round(result[i] + factor * (color2[i] - color1[i]));
            }
            return result;
        };

        // Scale the value to [0, 1]
        const factor = (value - min) / (max - min);
        const color = interpolateColor(red, green, factor);
        return `rgb(${color[0]}, ${color[1]}, ${color[2]})`;
    }
